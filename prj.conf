# 启用传感器驱动
CONFIG_SENSOR=y
CONFIG_BMI08X=y
CONFIG_BMI08X_ACCEL_STREAM=y
CONFIG_BMI08X_GYRO_STREAM=y
# 启用遥控器驱动
# CONFIG_REMOTE=y
# CONFIG_UART_ASYNC_API=y
# CONFIG_DCACHE=n
# 电机
# 当前编译的源文件里没有用到 CAN / 电机驱动（DeviceLayer 的 motor 源码未加入
# target_sources），需要时再打开
# CONFIG_CAN=y
# CONFIG_BLDCM=y
# DJI 电机 CAN 通常为 1Mbps；
# CONFIG_CAN_DEFAULT_BITRATE=1000000
# CONFIG_CAN_RX_MANAGER=y
# CONFIG_CAN_TX_MANAGER=y
# CONFIG_CAN_RX_MANAGER_MSGQ_MONITOR=y
# 丢帧告警限流：累计每丢 100 帧才打一条，避免刷屏冲掉其它日志（默认 1 太吵）
# CONFIG_CAN_RX_MANAGER_MSGQ_WARN_EVERY_N_DROPS=100
# 线程优先级（数值越小越高，0~14）
# 闭环时序：RX(反馈解析) → Update(计算) → System(打包) → TX(发送)，故 RX 高于 TX
# CONFIG_CAN_RX_MANAGER_RX_THREAD_PRIO=3
# CONFIG_CAN_TX_MANAGER_THREAD_PRIORITY=4
# DJI 心跳自动检测（shared system workqueue）
# CONFIG_BLDCM_HEARTBEAT_AUTOCHECK=y
# CONFIG_BLDCM_HEARTBEAT_POLL_PERIOD_MS=100
# 看门狗
CONFIG_WATCHDOG=y
CONFIG_IWDG_STM32=y
CONFIG_WDT_DISABLE_AT_BOOT=y   # 阻止驱动 init 时自动安装超时，由 IWDG_Init 接管

# 启用日志
CONFIG_LOG=y
# CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
# 启用CMSIS-DSP库
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_MATRIX=y 
# 启用 robotpilots 算法库（algo/），矩阵/KF/EKF 走 CMSIS-DSP 加速
CONFIG_ALGO=y
CONFIG_ALGO_ENABLE_ARM_MATH=y
# # C++ 支持（重要！）
CONFIG_CPP=y
CONFIG_STD_CPP17=y
# 启用浮点支持
CONFIG_FPU=y
CONFIG_FPU_SHARING=y


#  Enable RTT logging backend
CONFIG_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=5
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=2
#用于调试的宏 
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_ASSERT=y
# CONFIG_THREAD_ANALYZER=y//下面三行是线程分析器的配置，可以输出线程的内存占用情况
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_INIT_STACKS=y
# main线程
CONFIG_MAIN_STACK_SIZE=4096
